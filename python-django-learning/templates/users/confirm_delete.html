{% extends 'base.html' %}

{% block title %}确认删除 - {{ user.name }}{% endblock %}

{% block content %}
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-header">
                    <h2>确认删除</h2>
                </div>
                <div class="card-body">
                    <p>您确定要删除用户 <strong>{{ user.name }}</strong> 吗？</p>
                    <p class="text-danger">此操作无法撤销！</p>

                    <form method="post">
                        {% csrf_token %}  <!-- CSRF 保护 -->
                        <button type="submit" class="btn btn-danger">确认删除</button>
                        <a href="{% url 'users:user_detail' user.pk %}" class="btn btn-secondary">取消</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
