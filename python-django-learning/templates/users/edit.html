{% extends 'base.html' %}

{% block title %}编辑用户 - {{ user.name }}{% endblock %}

{% block content %}
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-header">
                    <h2>编辑用户</h2>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}  <!-- CSRF 保护 -->
                        
                        <!-- 表单字段 -->
                        {% for field in form %}
                            <div class="mb-3">
                                <label for="{{ field.id_for_label }}" class="form-label">
                                    {{ field.label }}
                                    {% if field.field.required %}
                                        <span class="text-danger">*</span>
                                    {% endif %}
                                </label>
                                {{ field }}
                                {% if field.errors %}
                                    <div class="text-danger mt-1">
                                        {% for error in field.errors %}
                                            <small>{{ error }}</small>
                                        {% endfor %}
                                    </div>
                                {% endif %}
                            </div>
                        {% endfor %}

                        <!-- 提交按钮 -->
                        <button type="submit" class="btn btn-primary">保存更改</button>
                        <a href="{% url 'users:user_detail' user.pk %}" class="btn btn-secondary">取消</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
